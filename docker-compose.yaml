services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitops
      POSTGRES_USER: fitops
      POSTGRES_PASSWORD: fitops-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitops -d fitops"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: s3
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  postgres-data:
  localstack-data:
